# Temporary: prints the widget chain behind a RenderFlex overflow at
# 320 dp / 1.3x in English. Removed once the fix is in.
name: Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq fonts-noto-cjk fonts-noto-cjk-extra
      - run: flutter pub get --enforce-lockfile
      - run: flutter test --no-pub --reporter expanded test/shell/probe_overflow_test.dart
