# Temporary: regenerates the goldens touched by the fork's UI work and uploads the
# binary patch, so the change can be reviewed and committed from a machine without
# Flutter. workflow_dispatch only; removed once the goldens are committed.
name: Goldens

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goldens:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Fonts the goldens were drawn with
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq fonts-noto-cjk=1:20230817+repack1-3 fonts-noto-cjk-extra=1:20230817+repack1-3
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/emoji.ttf" https://raw.githubusercontent.com/googlefonts/noto-emoji/v2.051/fonts/NotoColorEmoji.ttf
          echo "72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b  $RUNNER_TEMP/emoji.ttf" | sha256sum -c -
          sudo install -Dm644 "$RUNNER_TEMP/emoji.ttf" /usr/share/fonts/noto/NotoColorEmoji.ttf
      - run: flutter pub get --enforce-lockfile
      - name: Regenerate the goldens
        run: |
          flutter test --no-pub --concurrency=4 --update-goldens \
            test/agents/lineage_test.dart \
            test/chat/chat_features_test.dart \
            test/chat/chat_screen_test.dart \
            test/chat/chat_shell_test.dart \
            test/chat/composer_insert_flow_test.dart \
            test/chat/composer_mention_picker_test.dart \
            test/chat/dock/dock_chat_screen_test.dart \
            test/chat/fork_toast_test.dart \
            test/chat/message_actions_test.dart \
            test/chat/model_sheet_test.dart \
            test/chat/plus_panel_test.dart \
            test/chat/secret_mask_test.dart \
            test/integration/wiring_test.dart \
            test/media/generate_mode_test.dart \
            test/media/media_golden_test.dart \
            test/phone/phone_golden_test.dart \
            test/plugins/native/message_menu_plugins_test.dart \
            test/plugins/native/native_slots_golden_test.dart \
            test/plugins/view/plugin_card_fold_test.dart \
            test/share/share_entries_test.dart \
            test/shell/quick_panel_golden_test.dart \
            test/wallpaper/wallpaper_screens_test.dart
      - name: Binary patch of what changed
        if: always()
        working-directory: .
        run: |
          rm -rf app/test/**/failures
          git add -A -- app/test ':!**/failures/**'
          git diff --cached --binary > "$RUNNER_TEMP/goldens.patch"
          git diff --cached --stat | tail -5
          wc -c "$RUNNER_TEMP/goldens.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goldens-patch
          path: ${{ runner.temp }}/goldens.patch
          retention-days: 7
