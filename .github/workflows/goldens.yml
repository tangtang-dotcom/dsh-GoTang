name: Goldens

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goldens:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TZ: Asia/Shanghai
      DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Fonts the goldens were drawn with
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq fonts-noto-cjk=1:20230817+repack1-3 fonts-noto-cjk-extra=1:20230817+repack1-3
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/emoji.ttf" https://raw.githubusercontent.com/googlefonts/noto-emoji/v2.051/fonts/NotoColorEmoji.ttf
          echo "72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b  $RUNNER_TEMP/emoji.ttf" | sha256sum -c -
          sudo install -Dm644 "$RUNNER_TEMP/emoji.ttf" /usr/share/fonts/noto/NotoColorEmoji.ttf
      - run: flutter pub get --enforce-lockfile
      - name: Regenerate the plus panel goldens
        run: flutter test --no-pub --concurrency=1 --update-goldens --name "panel (with|at 320)" test/chat/plus_panel_test.dart
      - name: Commit the regenerated goldens
        working-directory: .
        run: |
          rm -rf app/test/**/failures
          git add -A -- app/test ':!**/failures/**'
          if git diff --cached --quiet; then
            echo "no golden changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: refresh plus panel goldens"
          git push
